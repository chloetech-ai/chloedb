[build-system]
requires = ["maturin>=1.16.0,<2"]
build-backend = "maturin"

[project]
name = "chloedb"
version = "0.3.0"
description = "ChloeDB from Python: an embedded search database (full text, vectors, graphs, SQL), or a chloedb-server over HTTP"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Rust"]

[project.optional-dependencies]
test = ["pytest"]
# chloedb.Frame (dataframes run in ChloeDB; Arrow in and out)
frame = ["pyarrow>=25.0.1"]
# chloedb.ingest.kafka
kafka = ["confluent-kafka>=2.16.1"]
# chloedb.langchain: a LangChain vector store (numpy for its maximal
# marginal relevance search)
langchain = ["langchain-core>=1.7.7", "numpy"]
# chloedb.langgraph: a LangGraph checkpointer and store
langgraph = ["langgraph>=1.2.20", "langgraph-checkpoint>=4.3.1"]
# chloedb.llama_index: a LlamaIndex vector store
llama-index = ["llama-index-core>=0.14.25"]

[tool.maturin]
python-source = "python"
module-name = "chloedb._chloedb"
# `import strata` (ChloeDB's old name) is `import chloedb`, with a warning.
python-packages = ["strata"]
features = ["pyo3/extension-module"]
