[package]
name = "strata-node"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "JavaScript bindings for Strata: the database in-process, as a Node-API addon"
publish = false

[lib]
name = "strata_node"
crate-type = ["cdylib"]

[dependencies]
# Node-API 8 (Node 12.22 and later; Bun and Deno load it too).
napi = { version = "3", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3"
strata = { path = "../strata", features = ["sqlite"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"

[features]
default = ["datafusion", "parquet", "s3"]
# DataFusion as the engine of joins, groups and sorts over a few thousand
# rows or more (`strata::query::df`); the default engine picks it by size.
datafusion = ["strata/datafusion"]
# Parquet files in and out (`fromParquet`, `importParquet`,
# `exportParquet`).
parquet = ["datafusion", "strata/parquet"]
# `s3://` URLs wherever a file is read or written (`strata::objects`).
s3 = ["strata/s3"]
# BERT embedding models (`bert`), with Apple's Accelerate on a Mac
# (`accelerate`); Model2Vec models need neither.
bert = ["strata/bert"]
accelerate = ["strata/accelerate"]
# Cross-encoders exported to ONNX (`onnx`), run by ONNX Runtime.
onnx = ["strata/onnx"]
# Images (`vision`): decoded, and embedded by SigLIP.
vision = ["strata/vision"]
# Sound (`audio`): decoded, and transcribed by Whisper.
audio = ["strata/audio"]

[profile.release]
codegen-units = 1
lto = "thin"

# CI's tests: release's optimisation without its link-time optimisation and
# single codegen unit, which take most of the time of building the addon.
[profile.ci]
inherits = "release"
codegen-units = 16
lto = false
