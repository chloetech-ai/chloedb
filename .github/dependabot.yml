# Dependabot's version updates, grouped so that each ecosystem and crate
# gets at most one pull request per run, for every lockfile and manifest in
# the repository: the eight Rust crates that lock their dependencies, the
# two Node packages, the Java package, the Python package, the two images'
# base images and the workflows' actions.
#
# Security updates (a pull request as soon as an advisory names a locked
# version, whatever this schedule says) are a repository setting, not this
# file: Settings > Code security > "Dependabot security updates", with
# "Secret scanning" and its "Push protection" beside it. They read the same
# directories listed here. The Supply chain workflow (supply-chain.yml)
# checks every Cargo.lock against RustSec's advisories each day as well.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directories:
      - /chloedb
      - /chloectx
      - /chloedb-server
      - /chloedb-py
      - /chloedb-crawl
      - /chloedb-sheets
      - /chloedb-java
      - /chloedb-js
    schedule:
      interval: monthly
    open-pull-requests-limit: 8
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directories: [/chloedb-apps, /chloedb-js]
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: maven
    directory: /chloedb-java
    schedule:
      interval: monthly
    groups:
      maven:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /chloedb-py
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/chloedb-server/deploy, /chloedb-apps/deploy]
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ["*"]
