name: CI

# A change to the documentation site, to Markdown files or to benchmark
# results alone builds and tests nothing.
#
# Main is protected by one required check, "CI result", which every run
# reports: the jobs below run when a change touches more than the
# documentation and benchmark results (job `changes`), and are skipped
# otherwise, which a required check counts as passing. A workflow skipped
# by a path filter would report nothing, and the pull request would wait
# for its check forever.
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each pull request merged onto the main it will
  # land on, as a pull request is tested.
  merge_group:
  # Every night, main's whole matrix, macOS included, whether or not
  # anything merged: flaky tests show up there before they block a merge.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A new push to a pull request cancels its older run. Pushes to main share
# one group that never cancels the run in progress, so main's runs keep
# finishing, but a group holds one waiting run and a newer push replaces
# it: after a burst of merges only the newest waits, and it tests every
# merge before it. (A group per commit queued every merge's whole run,
# 5 macOS jobs each against a limit of 5 at once, and the queue grew by
# hours.) The merge queue, the nightly run and a run by hand keep a group
# per event and commit, so none of them is dropped.
# The jobs only read the repository: the token gets no write rights.
permissions:
  contents: read

concurrency:
  group: ci-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# The jobs run on GitHub's standard runners, which cost nothing for a public
# repository: ubuntu-latest (4 cores, 16 GB) and macos-latest (3 cores,
# 7 GB). The organisation's own runners (gh-linux, gh-mac and gh-mac2) are
# billed by the minute even for a public repository, so no job uses them.
#
# macOS jobs are the scarcest: the account runs five at once. A pull
# request, the merge queue and a push to main run only ChloeDB's tests on
# macOS, where its NEON kernels and syncs differ from Linux, and CI result
# does not wait for them (job `macos`): a pull request waited 9 to 12
# minutes for a macOS runner and then 16 more, after every Linux job had
# passed. Its check still turns red on a failure. The nightly run and a run
# started by hand run every macOS job (8 of them), and CI result waits for
# each. (Until 8 November a push to main ran all 8 too: they took the five
# runners for up to 50 minutes a merge, and a pull request's macOS job
# waited 46 minutes behind them.)
#
# Caches (Swatinem/rust-cache, one per job) are saved by runs on main, the
# nightly and runs started by hand, and only restored by pull requests: a
# repository keeps 10 GB of caches, and with every pull request saving its
# own, main's were evicted and most jobs compiled every dependency (the
# Python job took 26 to 39 minutes that way, 20 with a cache). For the same
# reason Linux builds in chloedb/ name x86-64-v3 (AVX2, which every runner
# has) instead of its config's target-cpu=native, so that one cache serves
# every runner's CPU; on a runner with AVX-512 ChloeDB still picks those
# kernels at run time (chloedb::simd). macOS builds keep native, and the CPU
# in their cache's key.
jobs:
  # Whether the change touches more than the documentation site, Markdown
  # files and benchmark results (the data under chloedb/results,
  # chloedb-server/results and chloectx/results, which nothing builds or
  # reads): if not, every other job is skipped. A Python script there
  # still counts as code, since a job runs chloedb/results/sequence/gate.py,
  # and so does chloedb/results/workloads/, which tests/workload_gen.rs
  # checks is not stale.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      guide: ${{ steps.diff.outputs.guide }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Changed files
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$QUEUE_BASE" ;;
            *) base="$BEFORE" ;;
          esac
          # A diff needs only the two commits' trees, not the history
          # between them. No base (a new branch) or one that cannot be
          # fetched (a force push): test everything.
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git fetch --no-tags --depth=1 origin "$base"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "guide=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$base" HEAD | tee "$RUNNER_TEMP/changed"
          # The documentation's guide pages run as scripts (the docs job):
          # a change to them, or to the site's generator, runs them even
          # when no code changed.
          if grep -qE '^docs/(guide/|quickstart\.md$|site/scripts/build_docs\.py$)' "$RUNNER_TEMP/changed"; then
            echo "guide=true" >> "$GITHUB_OUTPUT"
          else
            echo "guide=false" >> "$GITHUB_OUTPUT"
          fi
          grep -vE '^docs/|\.md$' "$RUNNER_TEMP/changed" > "$RUNNER_TEMP/rest" || true
          if grep -qvE '^(chloedb|chloedb-server|chloectx)/results/' "$RUNNER_TEMP/rest" \
            || grep -qE '^(chloedb|chloedb-server|chloectx)/results/.*\.py$|^chloedb/results/workloads/' "$RUNNER_TEMP/rest"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: ${{ matrix.crate }} on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        # chloedb-crawl's crawl into a real cluster, and chloedb-sheets'
        # workbooks in one, run in server-smoke, which builds chloedb-server;
        # here their other tests and clippy.
        crate: [chloedb, chloectx, chloedb-server, chloedb-crawl, chloedb-sheets, chloedb-netops]
    runs-on: ${{ matrix.os }}
    # rust-cache saves only from a job that passed, so a macOS job that ran
    # out of time starts the next one cold too: chloedb-server's tests took
    # 59 minutes from a cold build on the macOS runner on 11-08, and Clippy
    # after them did not fit in 60.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 90 || 60 }}
    env: &test-env
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ${{ matrix.crate == 'chloedb' && '-C target-cpu=x86-64-v3' || '' }}
    steps: &test-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      # On macOS the chloedb crate builds with -C target-cpu=native
      # (chloedb/.cargo/config.toml), so its cache must not be restored on a
      # runner with another CPU: the key hashes the model and its
      # instruction sets (runners with the same model name differ in them,
      # and a cached proc macro then dies of SIGILL).
      - name: CPU model
        id: cpu
        shell: bash
        run: echo "model=$( (if [ -r /proc/cpuinfo ]; then grep -e 'model name' -e '^flags' /proc/cpuinfo | sort -u; else sysctl -n machdep.cpu.brand_string; fi) | cksum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # The key names this job (`test`) rather than leaving the job's id to
      # rust-cache, so that the pull request's macOS job (`macos`, the same
      # steps) restores the cache main's macOS job saves.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: ${{ matrix.crate }}
          shared-key: ${{ matrix.crate }}${{ runner.os == 'macOS' && matrix.crate == 'chloedb' && format('-{0}', steps.cpu.outputs.model) || '' }}-test
      # The ci profile is release without link-time optimisation and with
      # 16 codegen units (each crate's Cargo.toml): with release's, building
      # ChloeDB's test binaries took 37 of the 40 minutes of its tests.
      # ChloeDB's SQLite import and export (feature `sqlite`) are tested and
      # linted in the chloedb job; chloedb-server and the Python package turn
      # the feature on. --no-fail-fast runs every test binary even after one
      # fails: cargo stops at the first otherwise, and from 11-05 to 11-07 a
      # failing unit test of engine-compare kept chloedb-server's integration
      # tests from running on macOS at all.
      - name: Tests
        working-directory: ${{ matrix.crate }}
        run: cargo test --locked --profile ci --no-fail-fast ${{ matrix.crate == 'chloedb' && '--features sqlite' || '' }}
      # The cluster simulator over more seeds than its tests run (`cargo
      # test` built chloedb-sim): the first 3,000 of each world on every
      # change, and in the nightly run and a run started by hand 30,000 of
      # each that no run checked before, a new range each day. A seed
      # replays exactly: `chloedb-sim --seed N --trace` (with `--cluster`
      # for the second world) shows what happened in it.
      - name: Simulator seeds
        if: matrix.crate == 'chloedb-server' && runner.os == 'Linux'
        working-directory: chloedb-server
        shell: bash
        env:
          NEW_SEEDS: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          n=3000
          from=0
          if [ "$NEW_SEEDS" = true ]; then
            n=30000
            from=$(( 1000000 + $(date -u +%s) / 86400 * n ))
          fi
          status=0
          sim() {
            echo "chloedb-sim $*"
            if ! ./target/ci/chloedb-sim "$@" | tee "$RUNNER_TEMP/sim.out"; then
              status=1
              { echo "### chloedb-sim $*"; echo '```'; tail -n 60 "$RUNNER_TEMP/sim.out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          sim --seeds "$from..$((from + n))"
          sim --seeds "$from..$((from + n / 3))" --drop-ppm 150000
          sim --cluster --seeds "$from..$((from + n))"
          exit $status
      # Compiler warnings and clippy's correctness and suspicious lints fail
      # the build; style, complexity and performance lints are advice.
      - name: Clippy
        working-directory: ${{ matrix.crate }}
        run: cargo clippy --locked --release --all-targets ${{ matrix.crate == 'chloedb' && '--features sqlite' || '' }} -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings

  # ChloeDB's tests on macOS for a pull request, the merge queue and a push
  # to main: the `test` job's steps, in a job of its own that CI result does
  # not wait for (see the top of this file). In the nightly run and a run
  # started by hand they run in `test`, and this job is skipped. A push to
  # main saves the cache that a pull request's run restores.
  macos:
    name: ${{ matrix.crate }} on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push')
    strategy:
      matrix:
        os: [macos-latest]
        crate: [chloedb]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env: *test-env
    steps: *test-steps

  # chloedb-server, chloectx and the Python package build for a generic CPU,
  # where ChloeDB chooses its SIMD kernels at run time: test the kernels in
  # such a build, then with every SIMD path turned off. A job of its own, so
  # that it runs beside the chloedb tests rather than after them.
  kernels:
    name: chloedb kernels on a generic build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: -C target-cpu=x86-64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # A generic build runs on any x86-64 runner: no CPU model in the key.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: chloedb
          key: chloedb-generic
      - name: Kernels
        working-directory: chloedb
        run: |
          cargo test --locked --profile ci --lib -- vector:: postings:: forward:: simd
          CHLOEDB_SIMD=portable cargo test --locked --profile ci --lib -- vector:: postings:: forward::

  # Images (feature `vision`: the image crate and SigLIP through candle),
  # which the default build leaves out: the tests of vectors of images in
  # ChloeDB and through a server, with the `hash` model (SigLIP's weights
  # are not fetched here), and clippy over the feature's code. `vision`
  # includes `bert`, so the cross-encoder tests against transformers'
  # scores of the small models in chloedb/tests/models run here too.
  vision:
    name: images (feature vision)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: |
            chloedb
            chloedb-server
          key: vision
      - name: ChloeDB
        working-directory: chloedb
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-cpu=x86-64-v3
        run: |
          cargo test --locked --profile ci --features vision --test media_vectors --test media_fields --test derived_text --test rank_cross
          cargo clippy --locked --profile ci --features vision --all-targets -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings
      - name: chloedb-server
        working-directory: chloedb-server
        run: cargo test --locked --profile ci --features vision --test media_vectors --test media

  # Sound (feature `audio`: symphonia's decoders, and Whisper and CLAP
  # through candle): decoding, resampling and mel features, text derived
  # from sound and vectors of it with test models (the real models' weights
  # are not fetched here), and clippy over the feature's code in ChloeDB and
  # the server.
  audio:
    name: sound (feature audio)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: |
            chloedb
            chloedb-server
          key: audio
      - name: ChloeDB
        working-directory: chloedb
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-cpu=x86-64-v3
        run: |
          cargo test --locked --profile ci --features audio --test derived_audio --test audio_vectors
          cargo test --locked --profile ci --features audio --lib -- audio:: clap::
          cargo clippy --locked --profile ci --features audio --all-targets -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings
      - name: chloedb-server
        working-directory: chloedb-server
        run: cargo clippy --locked --profile ci --features audio -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings

  # DataFusion as the engine of plans' operators (feature `datafusion`,
  # chloedb::query::df): the differential test against ChloeDB's own
  # operators, window functions on both engines against SQLite's answers,
  # the compound-query suites again with DataFusion as the engine
  # (CHLOEDB_ENGINE=datafusion: a plan it does not lower runs on the
  # operators), Parquet files in and out (feature parquet, on DataFusion's
  # Arrow) with s3:// URLs (feature s3), and clippy over the features' code.
  datafusion:
    name: DataFusion engine (feature datafusion)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-cpu=x86-64-v3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: chloedb
          key: datafusion
      - name: ChloeDB
        working-directory: chloedb
        run: |
          cargo test --locked --profile ci --features datafusion --test datafusion_engine --test hash_function
          cargo test --locked --profile ci --features datafusion,sqlite --test window_functions --test set_operations
          CHLOEDB_ENGINE=datafusion cargo test --locked --profile ci --features datafusion --test compound_queries --test joins_across_tables --test operators --test distinct_on --test per_cap --test one_evaluator --test sql_tables --test correlated --test query_memory --test plan_ir --test json_fields --test json_columns
          # Parquet files in and out, and s3:// URLs (chloedb::parquet, chloedb::objects)
          cargo test --locked --profile ci --features datafusion,parquet,s3 --test parquet
          cargo test --locked --profile ci --features datafusion,parquet,s3 --lib -- parquet:: objects:: arrow_rows::
          cargo clippy --locked --profile ci --features datafusion,parquet,s3 --all-targets -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings

  # Power losses, full disks and failing syncs at every write of a storage
  # workload (storage::io, tests/storage_faults.rs). A job of its own: after
  # the chloedb tests, it took the macOS job past its hour.
  faults:
    name: fault injection on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-cpu=x86-64-v3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: CPU model
        id: cpu
        shell: bash
        run: echo "model=$( (if [ -r /proc/cpuinfo ]; then grep -e 'model name' -e '^flags' /proc/cpuinfo | sort -u; else sysctl -n machdep.cpu.brand_string; fi) | cksum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: chloedb
          key: chloedb-faults${{ runner.os == 'macOS' && format('-{0}', steps.cpu.outputs.model) || '' }}
      - name: Fault injection
        working-directory: chloedb
        run: cargo test --locked --profile ci --features fault-injection --test storage_faults

  # BM25 through SQL on three BEIR collections, and with the analyzers of
  # other languages on two MIRACL collections, against the committed
  # baselines (chloedb/tests/relevance_gate.rs): a ranking change must come
  # with its new numbers.
  relevance-gate:
    name: relevance gate (BEIR)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-cpu=x86-64-v3
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: chloedb
          key: relevance
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/beir
          key: beir-${{ hashFiles('chloedb/tests/fixtures/beir/fetch.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/miracl
          key: miracl-${{ hashFiles('chloedb/tests/fixtures/miracl/fetch.sh') }}
      - name: Collections
        run: |
          chloedb/tests/fixtures/beir/fetch.sh "$HOME/beir"
          chloedb/tests/fixtures/miracl/fetch.sh "$HOME/miracl" yo sw
      - name: Gate
        working-directory: chloedb
        run: CHLOEDB_BEIR_DIR="$HOME/beir" CHLOEDB_MIRACL_DIR="$HOME/miracl" CHLOEDB_RELEVANCE_GATE=required cargo test --locked --profile ci --test relevance_gate -- --nocapture

  # BM25's top 20 reranked by the cross-encoder ms-marco-MiniLM-L-6-v2 on
  # SciFact and NFCorpus, against its own baseline
  # (tests/fixtures/relevance_gate_cross_encoder.json). A job of its own:
  # the model scores 12,000 pairs, about ten minutes on four cores.
  relevance-gate-cross-encoder:
    name: relevance gate (cross-encoder)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-cpu=x86-64-v3
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: chloedb
          key: relevance-bert
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/beir
          key: beir-${{ hashFiles('chloedb/tests/fixtures/beir/fetch.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/models
          key: cross-encoder-${{ hashFiles('chloedb/tests/models/fetch_cross_encoder.sh') }}
      - name: Collections and model
        run: |
          chloedb/tests/fixtures/beir/fetch.sh "$HOME/beir"
          chloedb/tests/models/fetch_cross_encoder.sh "$HOME/models"
      - name: Gate
        working-directory: chloedb
        run: CHLOEDB_BEIR_DIR="$HOME/beir" CHLOEDB_MODELS="$HOME/models" CHLOEDB_RELEVANCE_GATE=required cargo test --locked --profile ci --features bert --test relevance_gate cross_encoder -- --nocapture

  # Miri runs the tests of ChloeDB's zero-copy byte views (postings::bytes)
  # and of the structures read through them, checking every access for
  # undefined behaviour: misaligned or out-of-bounds reads, dangling
  # pointers, aliasing. It interprets the code about a thousand times
  # slower, and on one thread, so it runs the tests sized for it (`miri_*`)
  # and other small ones, split in four parts of 6 to 12 minutes (the
  # pyramid's is one test of 11), on a portable build (scalar kernels; Miri
  # has no CPUID). The nightly is pinned to the one the tests were run with.
  miri:
    name: miri (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: pyramid
            tests: "postings::codecs::pyramid::tests::miri_"
          # The bit vectors' tests take 10 of these two parts' 12 minutes:
          # one of them goes with the others, so that a new one lands in
          # the first part.
          - part: bit vectors
            tests: "postings::bits --skip postings::bits::tests::next_one_and_ones"
          - part: bytes, loom, bit vector ones, query pool, substring
            tests: "postings::bytes postings::codecs::loom::tests::miri_ postings::bits::tests::next_one_and_ones query::pool substring::tests::miri_"
          - part: columns, graph, keys, text codec
            tests: "forward:: graph:: storage::pk::tests::collisions storage::pk::tests::section_written storage::live storage::updates::tests::round_trip text::codec --skip many_int_keys"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-27
          components: miri, rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: chloedb
          key: miri
      - name: Miri
        working-directory: chloedb
        env:
          RUSTFLAGS: ""
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo miri test --no-default-features --lib -- ${{ matrix.tests }}

  server-smoke:
    name: chloedb-server smoke test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: |
            chloedb-server
            chloedb-crawl
            chloedb-sheets
            chloedb-netops
            chloectx
          key: chloedb-server-smoke
      - name: Build
        working-directory: chloedb-server
        run: cargo build --locked --release
      - name: Serve a demo catalogue and query it
        working-directory: chloedb-server
        run: |
          ./target/release/chloedb-server --demo 5000 --db "$RUNNER_TEMP/demo.strata" --listen 127.0.0.1:7700 --grpc off &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:7700/v1/health && break; sleep 1; done
          curl -sf http://127.0.0.1:7700/v1/health | grep -q '"ok"'
          curl -sf -X POST http://127.0.0.1:7700/v1/query -H 'content-type: application/json' \
            -d '{"sql": "SELECT id, title, score() FROM products ORDER BY bm25(body, :q) DESC LIMIT 5", "params": {"q": "waterproof jacket"}}' \
            | grep -q '"rows"'
          curl -sf -X POST http://127.0.0.1:7700/v1/query -H 'content-type: application/json' \
            -d '{"sql": "SELECT category, COUNT(*) FROM products GROUP BY category ORDER BY 2 DESC LIMIT 5"}' \
            | grep -q '"rows"'
          curl -sf -X POST http://127.0.0.1:7700/v1/query -H 'content-type: application/json' \
            -d '{"sql": "WITH top AS (SELECT id FROM products ORDER BY bm25(body, '"'"'jaket'"'"', fuzzy => 1) DESC LIMIT 50) SELECT category, COUNT(*), AVG(price) FROM top GROUP BY category"}' \
            | grep -q '"rows"'
          curl -sf http://127.0.0.1:7700/metrics | grep -q chloedb_queries_total
          curl -sf http://127.0.0.1:7700/ | grep -qi '<html'
          # Rows into a new database from the command line, then over HTTP.
          printf '{"table": "t", "key": "id", "fields": [{"name": "id", "type": "keyword"}, {"name": "title", "type": "text"}]}' > "$RUNNER_TEMP/t.json"
          printf '{"id": "a", "title": "first row"}\n{"id": "b", "title": "second row", "extra": 1}\n' > "$RUNNER_TEMP/t.jsonl"
          ./target/release/chloedb-server import --db "$RUNNER_TEMP/t.strata" --schema "$RUNNER_TEMP/t.json" "$RUNNER_TEMP/t.jsonl"
          ./target/release/chloedb-server --db "$RUNNER_TEMP/t.strata" --listen 127.0.0.1:7702 --grpc off &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:7702/v1/health && break; sleep 1; done
          printf 'id,title\nc,third row\n' | curl -sf -X POST 'http://127.0.0.1:7702/v1/import?format=csv' -H 'content-type: text/csv' --data-binary @- | grep -q '"written":1'
          curl -sf http://127.0.0.1:7702/v1/health | grep -q '"docs":3'
          # A SQLite database's tables into a new database, and back out.
          python3 -c "import sqlite3, sys; c = sqlite3.connect(sys.argv[1]); c.executescript(\"CREATE TABLE notes (id INTEGER PRIMARY KEY, body TEXT, at DATETIME); INSERT INTO notes VALUES (1, 'a first note about rivers and mountains', '2026-10-01 12:00:00');\"); c.commit()" "$RUNNER_TEMP/s.sqlite"
          ./target/release/chloedb-server import --db "$RUNNER_TEMP/s.strata" "$RUNNER_TEMP/s.sqlite"
          ./target/release/chloedb-server export --db "$RUNNER_TEMP/s.strata" "$RUNNER_TEMP/s2.sqlite"
          python3 -c "import sqlite3, sys; c = sqlite3.connect(sys.argv[1]); assert c.execute(\"SELECT notes.rowid, at FROM notes_fts JOIN notes ON notes.rowid = notes_fts.rowid WHERE notes_fts MATCH 'river'\").fetchall() == [(1, '2026-10-01 12:00:00')]" "$RUNNER_TEMP/s2.sqlite"
          # And over HTTP: the SQLite file into the running server, a new table, and the database back out.
          curl -sf -X POST 'http://127.0.0.1:7702/v1/import?format=sqlite' -H 'content-type: application/vnd.sqlite3' --data-binary @"$RUNNER_TEMP/s.sqlite" | grep -q '"written":1'
          curl -sf http://127.0.0.1:7702/v1/export -o "$RUNNER_TEMP/s3.sqlite"
          python3 -c "import sqlite3, sys; c = sqlite3.connect(sys.argv[1]); assert c.execute('SELECT count(*) FROM t').fetchone() == (3,); assert c.execute('SELECT body FROM notes').fetchall() == [('a first note about rivers and mountains',)]" "$RUNNER_TEMP/s3.sqlite"
      # The crawler on a site its test serves, into a cluster of this
      # build's servers that it starts and grows to three shards.
      - name: Crawl a site into a growing cluster
        working-directory: chloedb-crawl
        env:
          CHLOEDB_SERVER_BIN: ${{ github.workspace }}/chloedb-server/target/release/chloedb-server
          CHLOEDB_CRAWL_NEED_SERVER: "1"
        run: cargo test --locked --profile ci --test site
      # Spreadsheets kept in a server of this build: made, changed,
      # imported (CSV, SQLite), filled by a query, saved as a table,
      # searched, exported, and read back after a restart.
      - name: Workbooks in a cluster
        working-directory: chloedb-sheets
        env:
          CHLOEDB_SERVER_BIN: ${{ github.workspace }}/chloedb-server/target/release/chloedb-server
          CHLOEDB_SHEETS_NEED_SERVER: "1"
        run: cargo test --locked --profile ci --test cluster
      # The network operations app on a server of this build: its 31
      # tables, the topology found from logs, each of the simulator's six
      # faults diagnosed and checked against its answer key, an action
      # approved, and the same network read back after a restart.
      - name: Network operations on a server
        working-directory: chloedb-netops
        env:
          CHLOEDB_SERVER_BIN: ${{ github.workspace }}/chloedb-server/target/release/chloedb-server
          CHLOEDB_NETOPS_NEED_SERVER: "1"
        run: cargo test --locked --profile ci --test cluster
      # ChloeCtx as an app of a cluster of this build's servers (two shards
      # and a coordinator): spaces, notes, contexts within a budget, an
      # exchange distilled by a stub model, incidents matched to an alert
      # that fires, and a restart.
      - name: ChloeCtx in a cluster
        working-directory: chloectx
        env:
          CHLOEDB_SERVER_BIN: ${{ github.workspace }}/chloedb-server/target/release/chloedb-server
          CHLOECTX_NEED_SERVER: "1"
        run: cargo test --locked --profile ci --test app_cluster
      # The app engine (chloedb-apps, a prototype in Node): apps built from
      # plans, stored as SQL rows in a server of this build, run, tested and
      # searched; no model is called.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: App engine against a server
        working-directory: chloedb-apps
        env:
          # The app engine reads its settings by their old names for now.
          STRATA_SERVER_BIN: ${{ github.workspace }}/chloedb-server/target/release/chloedb-server
          STRATA_APPS_NEED_SERVER: "1"
        # The library is searched by meaning too: the model its meaning
        # column names must be there before the tests write rows.
        run: |
          for i in 1 2 3; do "$STRATA_SERVER_BIN" fetch-model potion-retrieval-32M && break; sleep 10; done
          npm ci
          npm test
      # The same tests on a cluster, as the operator's spec.apps runs it: a
      # coordinator over two shards, which walks no graphs (the engine
      # walks its own) and serves no feed.
      - name: App engine on a cluster of two shards
        working-directory: chloedb-apps
        env:
          STRATA_SERVER_BIN: ${{ github.workspace }}/chloedb-server/target/release/chloedb-server
          STRATA_APPS_NEED_SERVER: "1"
          STRATA_APPS_TEST_SHARDS: "2"
        run: npm test
      # Swarm (chloedb-swarm, Node): a run of simulated users with a scripted
      # model in place of the API, each session in a sandbox server of this
      # build, its checks, reviews and findings stored in another one.
      - name: Swarm against a server
        working-directory: chloedb-swarm
        env:
          CHLOEDB_SERVER_BIN: ${{ github.workspace }}/chloedb-server/target/release/chloedb-server
          CHLOEDB_SWARM_NEED_SERVER: "1"
        run: |
          npm ci
          npm test

  python:
    name: Python package on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      # chloedb-py and chloedb-server build for a generic CPU: one cache on
      # every runner.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: |
            chloedb-py
            chloedb-server
          key: python
      # The client tests run against a real server.
      - name: Build chloedb-server
        working-directory: chloedb-server
        run: cargo build --locked --release
      # The Kafka consumer's exactly-once test runs against Redpanda, on
      # Linux only (macOS runners have no Docker); elsewhere it is skipped.
      - name: Start Redpanda
        if: runner.os == 'Linux'
        run: |
          docker run -d --name redpanda --network host docker.redpanda.com/redpandadata/redpanda:v24.2.7 \
            redpanda start --mode dev-container --smp 1 --memory 1G --overprovisioned \
            --kafka-addr 127.0.0.1:19092 --advertise-kafka-addr 127.0.0.1:19092 \
            --rpc-addr 127.0.0.1:33145 --advertise-rpc-addr 127.0.0.1:33145 \
            --pandaproxy-addr 127.0.0.1:18082 --schema-registry-addr 127.0.0.1:18081
          for i in $(seq 1 60); do docker exec redpanda rpk cluster health 2>/dev/null | grep -q 'Healthy: *true' && break; sleep 1; done
          docker exec redpanda rpk cluster health
          echo "CHLOEDB_KAFKA=127.0.0.1:19092" >> "$GITHUB_ENV"
      - name: Build and test
        working-directory: chloedb-py
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest numpy confluent-kafka
          # Database.query_arrow's and the Parquet tests (tests/test_arrow.py,
          # tests/test_parquet.py), the S3 ones against moto's local server
          pip install pyarrow polars pandas "moto[server]" boto3
          # The framework adapters' tests (tests/test_langchain.py,
          # test_langgraph.py, test_llama_index.py)
          pip install langchain-core langgraph llama-index-core
          # strata.train.sequence's test: CPU PyTorch (PyPI's macOS wheel is one)
          if [ "$RUNNER_OS" = Linux ]; then pip install torch --index-url https://download.pytorch.org/whl/cpu; else pip install torch; fi
          # The ci profile, as the crates' tests have: release's link-time
          # optimisation and single codegen unit took most of this step.
          maturin develop --profile ci --locked
          pytest tests -v
      # The recommender gate (chloedb/results/sequence/gate.py): every
      # candidate source and two baselines on MovieLens-1M, checked against
      # chloedb/tests/fixtures/recsys_gate.json and recsys_gate_time.json.
      # The ratings come from a mirror on Hugging Face, pinned by revision
      # and SHA-256. The two protocols run at once, a process each (one
      # after the other they took 6 and 2 minutes), and their output is
      # printed when both have ended.
      - name: Recommender gate
        if: runner.os == 'Linux'
        working-directory: chloedb-py
        run: |
          . .venv/bin/activate
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ml-1m-ratings.csv" https://huggingface.co/datasets/hazemessam/ml-1m/resolve/b7ed0ffb2157bfbc794a1e47e9044ab323bee57f/ratings.csv
          echo "d2baa264e8ef4c7fb0c555acae5dc80239612481efff5814df9eab98cb9e1fe0  $RUNNER_TEMP/ml-1m-ratings.csv" | sha256sum -c
          for protocol in loo time; do
            python ../chloedb/results/sequence/gate.py --ratings "$RUNNER_TEMP/ml-1m-ratings.csv" --protocol "$protocol" > "$RUNNER_TEMP/gate-$protocol.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/gate-$protocol.pid"
          done
          status=0
          for protocol in loo time; do
            wait "$(cat "$RUNNER_TEMP/gate-$protocol.pid")" || status=1
            cat "$RUNNER_TEMP/gate-$protocol.log"
          done
          exit $status
      - name: Clippy
        working-directory: chloedb-py
        run: cargo clippy --locked --release --all-targets -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings

  javascript:
    name: JavaScript package on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      # setup-bun and setup-deno download from GitHub's releases, which
      # answered the runners 504 for an hour on 8 November; npm's registry
      # has the same Bun and Deno.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        id: bun
        continue-on-error: true
      - if: steps.bun.outcome == 'failure'
        run: npm install -g bun && bun --version
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        id: deno
        continue-on-error: true
        with:
          deno-version: v2.x
      - if: steps.deno.outcome == 'failure'
        run: npm install -g deno && deno --version
      # chloedb-js and chloedb-server build for a generic CPU: one cache on
      # every runner.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: |
            chloedb-js
            chloedb-server
          key: javascript
      # The client tests run against a real server.
      - name: Build chloedb-server
        working-directory: chloedb-server
        run: cargo build --locked --release
      - name: Build and test
        working-directory: chloedb-js
        run: |
          node scripts/build.mjs --profile ci --locked
          node --test test/*.test.mjs
      # The same addon from Bun and Deno: a file opened, written and
      # searched in each runtime, and the client against a server.
      - name: Bun and Deno
        working-directory: chloedb-js
        run: |
          bun test/runtimes.mjs
          deno run --allow-ffi --allow-read --allow-write --allow-env --allow-net --allow-run --allow-sys test/runtimes.mjs
      - name: Clippy
        working-directory: chloedb-js
        run: cargo clippy --locked --release --all-targets -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings

  # The Java package (chloedb-java): its native library, built by cargo
  # inside mvn package, and the Java classes' tests against it on the
  # oldest Java the package supports (11) and on the newest long-term one,
  # which warns about native libraries loaded without
  # --enable-native-access.
  java:
    name: Java package on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      # chloedb-java builds for a generic CPU: one cache on every runner.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: chloedb-java
          key: java
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      # The ci profile, as the crates' tests have.
      - name: Build and test on Java 11
        working-directory: chloedb-java
        run: mvn -B -ntp -Dcargo.profile=ci package
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Test on Java 25
        working-directory: chloedb-java
        run: mvn -B -ntp -Dcargo.profile=ci -Dcargo.skip=true test
      - name: Native library's own tests
        working-directory: chloedb-java
        run: cargo test --locked --profile ci
      - name: Clippy
        working-directory: chloedb-java
        run: cargo clippy --locked --release --all-targets -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings

  # The one check main requires: every job above passed, or was skipped
  # because the change touches only the documentation. A failed or
  # cancelled job fails it. It does not wait for `macos`, the ChloeDB tests
  # on macOS of a pull request and a push to main (see the top of this file).
  # The documentation site's pages (docs/site/docs/, written by
  # docs/site/scripts/build_docs.py from docs/guide/ and the Markdown
  # under docs/) are up to date with their sources. Every change: an edit
  # of docs/chloedb/*.md changes a page too.
  docs-site:
    name: Documentation site is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: python3 docs/site/scripts/build_docs.py --check
        run: |
          pip install -r docs/site/scripts/requirements.txt
          python docs/site/scripts/build_docs.py --check

  # Every code block of the guide's pages (docs/guide/*.md,
  # docs/quickstart.md) runs, in order, against this commit's programs, and
  # prints what the page shows (docs/guide/run.py).
  docs:
    name: Documentation site and its examples
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.guide == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: |
            chloedb-server
            chloedb-crawl
            chloedb-sheets
            chloectx
            chloedb-py
          key: docs
      - name: Build the programs the pages use
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          for crate in chloedb-server chloedb-crawl chloedb-sheets chloectx; do
            (cd "$crate" && cargo build --locked --profile ci)
          done
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install maturin -r docs/guide/requirements.txt
          (cd chloedb-py && maturin develop --locked --profile ci)
      # The embedding models the pages name are kept between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/chloedb-docs/models
          key: docs-models-v1
      - name: Run the guide's pages
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          python docs/guide/run.py

  ci-result:
    name: CI result
    if: always()
    needs: [changes, test, kernels, vision, audio, datafusion, faults, relevance-gate, relevance-gate-cross-encoder, miri, server-smoke, python, javascript, java, docs-site, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items() if v["result"] not in ("success", "skipped")}
          for k, r in sorted(bad.items()):
              print(f"{k}: {r}")
          sys.exit(1 if bad else 0)
          '
