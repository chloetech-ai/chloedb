name: Chaos

# Every night, strata-chaos (strata-server/src/bin/strata-chaos) plays its
# scenarios on a cluster of strata-server processes on one runner: 2 shards
# of 3 copies, 2 spares and 2 coordinators, with clients that search, read
# by key and add to counters through the coordinators. The scenarios crash
# and lose nodes, cut and slow links, freeze and throttle processes, fill
# disks, flip bits on disk, wipe a volume, give a copy the wrong token,
# flood the cluster with queries and kill a coordinator mid-move. After
# each one the writers' ledger is checked. The run fails when a counter
# is below its acknowledged adds (a lost write) or above the adds that may
# have applied (a write applied twice), or when a scenario could not be
# played.
#
# It is not part of CI result: it takes about half an hour, and the
# timings it records depend on a shared runner. A pull request runs one
# scenario with its tests instead (strata-server/tests/chaos.rs, a primary
# killed under writes). The summary of a run is results.md, and the
# artifact keeps results.json and events.jsonl for 14 days.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      scenarios:
        description: "The scenarios to play, comma-separated (strata-chaos run --list); empty: every one"
        required: false
        default: ""

concurrency:
  group: chaos
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  chaos:
    name: strata-chaos scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: strata-server
          key: strata-chaos
      - name: Build
        working-directory: strata-server
        run: cargo build --profile ci --bin strata-server --bin strata-chaos
      # Cutting links takes iptables rules per process uid, and full disks
      # a tmpfs per server: both need root. Each server runs as a uid of its
      # own, which cannot reach the runner's home, so the binaries (side by
      # side: strata-chaos starts the strata-server beside it) and the
      # cluster's directory are outside it.
      - name: Play the scenarios
        shell: bash
        env:
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          set -o pipefail
          sudo install -d -m 755 /opt/strata-chaos
          sudo install -m 755 strata-server/target/ci/strata-chaos strata-server/target/ci/strata-server /opt/strata-chaos/
          sudo /opt/strata-chaos/strata-chaos run --dir /tmp/strata-chaos --disk-mb 512 ${SCENARIOS:+--scenarios "$SCENARIOS"} 2>&1 | tee "$RUNNER_TEMP/chaos.log"
      - name: Summary
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/strata-chaos/results.md ]; then cat /tmp/strata-chaos/results.md >> "$GITHUB_STEP_SUMMARY"; fi
          sudo cp /tmp/strata-chaos/results.md /tmp/strata-chaos/results.json /tmp/strata-chaos/events.jsonl "$RUNNER_TEMP/" 2>/dev/null || true
          sudo chown "$(id -u)" "$RUNNER_TEMP"/results.* "$RUNNER_TEMP"/events.jsonl 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-results
          path: |
            ${{ runner.temp }}/results.md
            ${{ runner.temp }}/results.json
            ${{ runner.temp }}/events.jsonl
            ${{ runner.temp }}/chaos.log
          retention-days: 14
          if-no-files-found: warn
