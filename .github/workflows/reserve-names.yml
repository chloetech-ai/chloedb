name: reserve names

# Publishes the placeholders in packaging/chloedb/, version 0.0.1 of
# `chloedb` on PyPI, npm and crates.io, which hold the name until releases
# go out under it. Run by hand (Actions, "reserve names", Run workflow),
# naming the registries; each is its own job and needs its own setup first:
#
# * PyPI: a trusted publisher for the project chloedb (pypi.org, Publishing:
#   owner chloetech-ai, repository strata, workflow reserve-names.yml,
#   environment pypi). No token is stored anywhere.
# * npm: the repository secret NPM_TOKEN, an npm token that can publish.
# * crates.io: the repository secret CARGO_REGISTRY_TOKEN, a crates.io token
#   with the publish-new scope.
#
# A registry refuses a version it already holds, so a second run fails for
# the registries that took it and changes nothing there.
on:
  workflow_dispatch:
    inputs:
      registries:
        description: "Registries to publish to, any of: pypi npm crates"
        default: "pypi npm crates"

permissions:
  contents: read

jobs:
  pypi:
    if: contains(inputs.registries, 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build packaging/chloedb/python --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    if: contains(inputs.registries, 'npm')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish
        working-directory: packaging/chloedb/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "::error::the repository secret NPM_TOKEN is not set"; exit 1; }
          npm publish --access public --provenance

  crates:
    if: contains(inputs.registries, 'crates')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        working-directory: packaging/chloedb/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "::error::the repository secret CARGO_REGISTRY_TOKEN is not set"; exit 1; }
          cargo publish
