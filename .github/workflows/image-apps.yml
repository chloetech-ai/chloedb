name: Image (app engine)

# The app engine's image, which the operator runs beside a cluster
# (spec.apps): ghcr.io/chloetech-ai/chloedb-apps, for x86-64 and arm64 in
# one tag, as image.yml does for chloedb-server.
#
# A push to main that changes the engine publishes it as `latest` and as
# the commit's full sha. A pull request that changes it builds both images
# and publishes nothing. A run started by hand publishes the branch it runs
# on, as its sha only.
#
# The image copies chloedb-server out of chloedb-server's `latest` (for an
# engine run alone, without a cluster); nothing else in it is Rust, so each
# architecture builds in minutes.
on:
  push:
    branches: [main]
    paths:
      - "chloedb-apps/**"
      - ".github/workflows/image-apps.yml"
  pull_request:
    paths:
      - "chloedb-apps/deploy/Dockerfile"
      - "chloedb-apps/deploy/Dockerfile.dockerignore"
      - "chloedb-apps/package.json"
      - "chloedb-apps/package-lock.json"
      - ".github/workflows/image-apps.yml"
  workflow_dispatch:

concurrency:
  group: image-apps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/chloetech-ai/chloedb-apps
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    name: app engine image (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - if: env.PUSH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: chloedb-apps
          file: chloedb-apps/deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=The app engine (chloedb-apps) that runs beside a ChloeDB cluster
          cache-from: type=gha,scope=image-apps-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-apps-${{ matrix.arch }}
      # The image starts: its browser, its model client and its server.
      - if: env.PUSH != 'true'
        run: |
          docker run --rm --entrypoint sh "$IMAGE:${{ github.sha }}-${{ matrix.arch }}" -c '
            /opt/node_modules/.bin/claude --version && chloedb-server --version &&
            cd /opt/chloedb-apps && node -e "require(\"/opt/node_modules/playwright\").chromium.launch().then((b) => b.close())"'

  publish:
    name: app engine image (publish)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One tag for both architectures
        run: |
          tags=(-t "$IMAGE:${{ github.sha }}")
          if [ "${{ github.event_name }}" = push ]; then tags+=(-t "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:${{ github.sha }}-amd64" "$IMAGE:${{ github.sha }}-arm64"
          docker buildx imagetools inspect "$IMAGE:${{ github.sha }}"
