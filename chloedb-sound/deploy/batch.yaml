# A temporary build of a bigger Sound Explorer, beside deploy/k8s.yaml: two
# pods on a node pool of their own (chloedb/pool=sound-batch, deleted when
# the build is done), each with a chloedb-server with CLAP. sound-batch-0
# downloads the sounds, makes the rows with tools/prepare.py (embedding the
# windows on both servers in turn: --embed) and builds the database;
# sound-batch-1 only embeds. Its database and rows are then copied to the
# sound node's /mnt/chloedb/sound and swapped in.
#   kubectl -n strata exec sound-batch-0 -- sh -c '...'
# Binaries, the model and the tools are copied in, as for sound-work.
apiVersion: v1
kind: Pod
metadata: {name: sound-batch-0, namespace: strata, labels: {app: sound-batch}}
spec:
  nodeSelector: {chloedb/pool: sound-batch}
  tolerations: [{key: chloedb/pool, operator: Equal, value: sound-batch, effect: NoSchedule}]
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution: [{labelSelector: {matchLabels: {app: sound-batch}}, topologyKey: kubernetes.io/hostname}]
  containers:
  - name: work
    image: mirror.gcr.io/library/debian:trixie-slim
    command: ["sh", "-c", "apt-get update -q && apt-get install -yq --no-install-recommends ca-certificates curl python3 python3-numpy python3-venv ffmpeg >/dev/null && python3 -m venv --system-site-packages /opt/py && /opt/py/bin/pip install -q pyarrow && touch /tmp/ready && sleep infinity"]
    env:
    - {name: CHLOEDB_KEY, valueFrom: {secretKeyRef: {name: sound-admin, key: token}}}
    - {name: CHLOEDB_TOKEN, valueFrom: {secretKeyRef: {name: sound-admin, key: token}}}
    - {name: CHLOEDB_MODELS, value: /work/models}
    ports: [{containerPort: 7700}]
    resources: {requests: {cpu: "7", memory: 8Gi}, limits: {memory: 14Gi}}
    volumeMounts: [{name: work, mountPath: /work}]
  volumes: [{name: work, hostPath: {path: /mnt/chloedb/sound-batch, type: DirectoryOrCreate}}]
---
