# Milvus 2.6 standalone, with its embedded etcd and local storage (as
# Milvus's standalone_embed.sh runs it). One node with the whole budget of
# the other engines' two data pods (3 CPUs, 6 GiB; compare.sh fills in
# __CPU__ and __MEM__), its data on the node's own disk (emptyDir).
# compare.sh writes it from this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: milvus-config
  namespace: __NS__
data:
  embedEtcd.yaml: |
    listen-client-urls: http://0.0.0.0:2379
    advertise-client-urls: http://0.0.0.0:2379
    quota-backend-bytes: 4294967296
    auto-compaction-mode: revision
    auto-compaction-retention: '1000'
  user.yaml: |
    # Nothing beyond the defaults.
---
apiVersion: v1
kind: Service
metadata:
  name: milvus
  namespace: __NS__
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: milvus}
  ports:
    - {name: api, port: 19530}
    - {name: health, port: 9091}
---
apiVersion: v1
kind: Pod
metadata:
  name: milvus-0
  namespace: __NS__
  labels: {app: milvus, engine: milvus}
spec:
  hostname: milvus-0
  subdomain: milvus
  nodeName: __NODE__
  containers:
    - name: milvus
      image: milvusdb/milvus:v2.6.26
      imagePullPolicy: IfNotPresent
      args: [milvus, run, standalone]
      env:
        - {name: ETCD_USE_EMBED, value: "true"}
        - {name: ETCD_DATA_DIR, value: /var/lib/milvus/etcd}
        - {name: ETCD_CONFIG_PATH, value: /milvus/configs/embedEtcd.yaml}
        - {name: COMMON_STORAGETYPE, value: local}
        - {name: DEPLOY_MODE, value: STANDALONE}
      ports:
        - {name: api, containerPort: 19530}
        - {name: health, containerPort: 9091}
      readinessProbe:
        httpGet: {path: /healthz, port: health}
        periodSeconds: 2
      resources:
        requests: {cpu: __CPU__, memory: __MEM__}
        limits: {cpu: __CPU__, memory: __MEM__}
      volumeMounts:
        - {name: data, mountPath: /var/lib/milvus}
        - {name: config, mountPath: /milvus/configs/embedEtcd.yaml, subPath: embedEtcd.yaml}
        - {name: config, mountPath: /milvus/configs/user.yaml, subPath: user.yaml}
  volumes:
    - name: data
      emptyDir: {}
    - name: config
      configMap: {name: milvus-config}
