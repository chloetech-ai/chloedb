# Strata: shard __I__ of 2, serving the database `engine-compare build`
# wrote on this node's own disk (hostPath /var/local/compare, so the pod
# must run on the node that built it). With the coordinator below, the
# shards and the coordinator together have the same CPU and memory as the
# other engines' two data pods (strata-coordinator.yaml). compare.sh
# writes strata-0 and strata-1 from this file when STRATA_COORD=pod (by
# default, from strata-coordinating.yaml).
apiVersion: v1
kind: Service
metadata:
  name: strata
  namespace: __NS__
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: strata-shard}
  ports:
    - {name: http, port: 7700}
    - {name: grpc, port: 7701}
---
apiVersion: v1
kind: Pod
metadata:
  name: strata-__I__
  namespace: __NS__
  labels: {app: strata-shard, engine: strata}
spec:
  hostname: strata-__I__
  subdomain: strata
  nodeName: __NODE__
  containers:
    - name: strata
      image: __IMAGE__
      imagePullPolicy: IfNotPresent
      # A 30 s deadline, the time engine-compare's client waits for every
      # engine: the default of 5 s turned a cold first vector query at 10M
      # into "no answer in time", which drops the kind from the run.
      # The answer cache off (--answer-cache-mb 0): from 13 November 2026
      # (#456, 0.3.1) a server keeps its answers and answers a query asked
      # again on the same version from memory, and the timed runs repeat
      # 300 queries, so after their first lap 99.5% of the queries came
      # from it (the audit of 15 November 2026, PRF-1). The other engines'
      # result caches are off too (README.md, "No result caches"). An image
      # from before #456 has no such cache, and no such flag. The server
      # goes by its old name, strata-server, which every image has, also
      # those from before the rename that STRATA_COORD=pod is for.
      command: [sh, -c]
      args:
        - |
          nocache=""
          if strata-server --help 2>/dev/null | grep -q -- --answer-cache-mb; then nocache="--answer-cache-mb 0"; fi
          exec strata-server --db /local/__COLL__.shard__I__of2.strata --listen 0.0.0.0:7700 --grpc 0.0.0.0:7701 --timeout-ms 30000 $nocache
      # Strata serves beyond loopback only with a token: a random one per
      # cluster, which compare.sh keeps in the secret strata-token and gives
      # the coordinator and the client too.
      env:
        - {name: STRATA_TOKEN, valueFrom: {secretKeyRef: {name: strata-token, key: token}}}
      ports:
        - {name: http, containerPort: 7700}
        - {name: grpc, containerPort: 7701}
      readinessProbe:
        httpGet: {path: /v1/health, port: http}
        periodSeconds: 2
      resources:
        requests: {cpu: __CPU__, memory: __MEM__}
        limits: {cpu: __CPU__, memory: __MEM__}
      volumeMounts:
        - {name: local, mountPath: /local}
  volumes:
    - name: local
      hostPath: {path: /var/local/compare, type: Directory}
