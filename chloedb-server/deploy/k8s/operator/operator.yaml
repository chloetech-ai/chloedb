# The ChloeDB operator: one Deployment running `chloedb-server operator`,
# which installs the StrataCluster resource definition (crd.json) when it
# starts and then keeps every StrataCluster in every namespace as its spec
# says: the shards' StatefulSets, their Services, the coordinators, and the
# cluster map behind them (shards joined, copies added and removed, slots
# moved, primaries handed over). See deploy/README.md.
#
#   kubectl apply -f deploy/k8s/operator/operator.yaml
#   kubectl apply -f deploy/k8s/operator/cluster.yaml
#
# It reaches each cluster's coordinators through their Service, so it runs
# in the cluster. To watch one namespace only, add --namespace NAME to its
# args (and a Role in place of the ClusterRole, if you like).
apiVersion: v1
kind: Namespace
metadata:
  name: strata-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: strata-operator
  namespace: strata-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: strata-operator
rules:
  # Installing and updating its own resource definition (--no-crd: not).
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, create, patch]
  # (patch: the coordinators of a cluster may change its sizes, and a Role
  # grants only what its maker holds.)
  - apiGroups: [strata.chloetech.ai]
    resources: [strataclusters]
    verbs: [get, list, watch, patch]
  - apiGroups: [strata.chloetech.ai]
    resources: [strataclusters/status]
    verbs: [get, patch, update]
  # What a cluster is made of.
  - apiGroups: [apps]
    resources: [statefulsets, deployments]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [services, configmaps, serviceaccounts]
    verbs: [get, create, patch]
  # (delete: the Service of an app beside the cluster that was turned off,
  # spec.crawler, spec.sheets, spec.apps or spec.follow.)
  - apiGroups: [""]
    resources: [services]
    verbs: [delete]
  # The coordinators' account, which reads and scales its own cluster.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, create, patch]
  # Which copies are ready, restarting one with new settings, growing
  # volumes, deleting the volumes of a shard that left, and making the app
  # engine's volume (spec.apps).
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, create, delete, patch]
  # A cluster's tokenSecret, to call its coordinators. Making, changing
  # and deleting Secrets (each app's credentials) is strata-operator-secrets',
  # granted in the namespaces that hold clusters only (below).
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  # The Lease of each cluster's map, which its coordinators' Role grants
  # (one coordinator at a time changes the map), and a Role grants only
  # what its maker holds.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: strata-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: strata-operator
subjects:
  - kind: ServiceAccount
    name: strata-operator
    namespace: strata-system
---
# Each app's credentials (<cluster>-<app>-credentials: its own key and
# token), made, changed and deleted by the operator: Secrets it may write
# only where a RoleBinding grants this, not every Secret of the Kubernetes
# cluster. Bound here in the namespace `strata`; for clusters in another
# namespace, bind it there too:
#
#   kubectl -n NS create rolebinding strata-operator-secrets \
#     --clusterrole=strata-operator-secrets --serviceaccount=strata-system:strata-operator
#
# Without it, the apps of a cluster there keep the admin token.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: strata-operator-secrets
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch, delete]
---
apiVersion: v1
kind: Namespace
metadata:
  name: strata
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: strata-operator-secrets
  namespace: strata
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: strata-operator-secrets
subjects:
  - kind: ServiceAccount
    name: strata-operator
    namespace: strata-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strata-operator
  namespace: strata-system
  labels: {app.kubernetes.io/name: strata-operator}
spec:
  # One at a time: two would each take the same step.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: strata-operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: strata-operator}
    spec:
      serviceAccountName: strata-operator
      containers:
        - name: operator
          image: chloedb-server:dev
          imagePullPolicy: IfNotPresent
          args: [operator]
          env:
            - {name: RUST_LOG, value: info}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 256Mi}
