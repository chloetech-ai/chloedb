# gh_people: each person's summary (what they did, year by year, the repos
# they worked on most), and gh_repo_people: the 30 people who worked most on
# each kept repo, built on each node beside its running shard from
# the shard's events (/work/all/events/sN, prepare's output) by
# `chloedb-gh people`, and imported into a copy of the node's vector part,
# /work/vec/gh-side.chloedb, which vec.yaml then serves: the person pages
# read a person's four rows there (one a shard: a shard's repos are its
# own) rather than the actor column of 11.2 billion events, and a repo's
# page its people rather than every event of a busy repo.
#   kubectl apply -f people-build.yaml; kubectl logs -f gh-peopleb-N
# Needs /work/vec/chloedb-gh-people (chloedb-gh built for Debian 12) and the shard's server
# binary /work/db/bin/chloedb-server-035p. About 30 minutes a node (a pass
# reads the shard's 2.8 billion events in 90 to 100 s; 16 passes keep a
# pass's sums near 1.5 GB: 12 ran out of the 3 GiB); the
# pods end when done (delete them after).
apiVersion: v1
kind: ConfigMap
metadata: {name: gh-people-build, namespace: strata}
data:
  build.sh: |
    #!/bin/sh
    # build.sh N: shard N's people into /work/red/people/sN, then a copy of
    # the vector part with them, /work/vec/gh-side.chloedb.
    set -e
    N=$1; V=/work/vec; SRV=/work/db/bin/chloedb-server-035p; GH=/work/vec/chloedb-gh-people
    [ -e $V/gh-side.chloedb ] && { echo "$V/gh-side.chloedb is there already"; exit 1; }
    ls -la $GH $SRV $V/gh-vec.chloedb
    t=$(date +%s)
    $GH people --input /work/all --shard $N --out /work/red --passes ${PASSES:-16} --threads ${THREADS:-3} --kept /work/red/repos/s$N.parquet
    $GH repo-people --out /work/red --shard $N --passes 4
    echo "summed in $(( $(date +%s)-t )) s"; t=$(date +%s)
    du -sh /work/red/people/s$N /work/red/people_repos/s$N /work/red/repo_people/s$N
    # The vector part is only read (its server writes nothing to it), so a
    # copy while it serves is a copy of it.
    cp $V/gh-vec.chloedb $V/gh-side.chloedb.tmp
    CHLOEDB_MODELS=/work/db/models $SRV import --db $V/gh-side.chloedb.tmp --schema /cfg/gh_people.json --table gh_people /work/red/people/s$N/p*-of-${PASSES:-16}.parquet 2>&1 | tail -5
    CHLOEDB_MODELS=/work/db/models $SRV import --db $V/gh-side.chloedb.tmp --schema /cfg/gh_repo_people.json --table gh_repo_people /work/red/repo_people/s$N/p*-of-04.parquet 2>&1 | tail -5
    cp $V/gh-vec.chloedb.slots $V/gh-side.chloedb.slots
    mv $V/gh-side.chloedb.tmp $V/gh-side.chloedb
    for f in $V/gh-side.chloedb.tmp-*; do [ -e "$f" ] && mv "$f" "$V/gh-side.chloedb${f#$V/gh-side.chloedb.tmp}"; done
    echo "imported in $(( $(date +%s)-t )) s"
    ls -la $V; du -sh $V/gh-side.chloedb
    echo done
  gh_repo_people.json: |
    {"table": "gh_repo_people", "shard_by": "repo", "cluster_by": "repo", "compression": "zstd",
     "fields": [
      {"name": "repo", "type": "int", "not_null": true},
      {"name": "actor", "type": "int", "not_null": true},
      {"name": "n", "type": "int"},
      {"name": "first", "type": "int"},
      {"name": "last", "type": "int"}]}
  gh_people.json: |
    {"table": "gh_people", "shard_by": "part", "cluster_by": "actor", "compression": "zstd",
     "fields": [
      {"name": "part", "type": "int", "not_null": true},
      {"name": "actor", "type": "int", "not_null": true},
      {"name": "events", "type": "int"},
      {"name": "stars", "type": "int"},
      {"name": "work", "type": "int"},
      {"name": "kinds", "type": "keyword", "indexed": false},
      {"name": "years", "type": "keyword", "indexed": false},
      {"name": "repos", "type": "keyword", "indexed": false}]}
---
apiVersion: v1
kind: Pod
metadata: {name: gh-peopleb-0, namespace: strata}
spec:
  restartPolicy: Never
  nodeSelector: {chloedb/gh-shard: "0"}
  tolerations: [{key: chloedb/pool, operator: Equal, value: gh, effect: NoSchedule}]
  containers:
  - name: build
    image: python:3.13-slim-trixie
    command: ["sh", "/cfg/build.sh", "0"]
    resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {memory: 3Gi}}
    volumeMounts: [{name: work, mountPath: /work}, {name: cfg, mountPath: /cfg}]
  volumes:
  - {name: work, hostPath: {path: /mnt/chloedb/gh, type: Directory}}
  - {name: cfg, configMap: {name: gh-people-build}}
---
apiVersion: v1
kind: Pod
metadata: {name: gh-peopleb-1, namespace: strata}
