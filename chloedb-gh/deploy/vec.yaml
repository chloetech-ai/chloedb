apiVersion: v1
kind: Service
metadata: {name: gh-vec, namespace: strata}
spec:
  selector: {app: gh-vec}
  ports: [{name: http, port: 7700, targetPort: 7700}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gh-vec, namespace: strata}
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector: {matchLabels: {app: gh-vec}}
  template:
    metadata: {labels: {app: gh-vec}}
    spec:
      nodeSelector: {chloedb/gh-shard: "3"}
      tolerations: [{key: chloedb/pool, operator: Equal, value: gh, effect: NoSchedule}]
      containers:
      - name: coordinator
        image: ghcr.io/chloetech-ai/chloedb-server@sha256:29084d3481fdaef5c5f1eb36fcf3b3363f71cec640ed9f1eaf5366da4226ee1f
        command: ["sh", "-c", "exec $(command -v chloedb-server || command -v strata-server) --shards http://gh-v0.strata.svc:7701,http://gh-v1.strata.svc:7701,http://gh-v2.strata.svc:7701,http://gh-v3.strata.svc:7701 --listen 0.0.0.0:7700 --grpc off"]
        env:
        - {name: CHLOEDB_TOKEN, valueFrom: {secretKeyRef: {name: gh-admin, key: token}}}
        ports: [{containerPort: 7700}]
        readinessProbe: {httpGet: {path: /readyz, port: 7700}, periodSeconds: 5}
        resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 768Mi}}
