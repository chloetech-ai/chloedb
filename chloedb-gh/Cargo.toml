[package]
name = "chloedb-gh"
version = "0.3.8"
edition = "2021"
license = "Apache-2.0"
description = "GitHub on ChloeDB: every public event since 2011 from GH Archive, repos found by what they do, why they trend, what people use instead, who keeps them going, and what to star next"

# A client of chloedb-server over HTTP, as chloedb-hn and chloedb-arxiv are:
# no ChloeDB crate in its build. `prepare` turns GH Archive's hourly files
# into Parquet rows split by the shard each row belongs to, so a cluster's
# shards can load them offline (`chloedb-server import`).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "gzip", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
axum = "0.7"
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
parquet = { version = "59.3", default-features = false, features = ["arrow", "zstd"] }
arrow-array = "59.3"
arrow-schema = "59.3"
twox-hash = { version = "2", default-features = false, features = ["xxhash3_64"] }
rustc-hash = "2"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4

# CI's tests (cargo test --profile ci), as in the other crates.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
