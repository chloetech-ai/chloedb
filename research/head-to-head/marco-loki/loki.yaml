# Loki as one process with its chunks and index on the local disk, the way
# Loki's own docs start it (single binary, filesystem storage, TSDB index,
# schema v13). Only the limits below change from Loki's defaults: they let one
# tenant push an hour of lines as fast as the client sends them and read
# every line back, and the results cache is off so each timed query runs.
auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  http_server_read_timeout: 300s
  http_server_write_timeout: 300s
  grpc_server_max_recv_msg_size: 104857600
  grpc_server_max_send_msg_size: 104857600
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  ingestion_rate_mb: 1024
  ingestion_burst_size_mb: 2048
  per_stream_rate_limit: 512MB
  per_stream_rate_limit_burst: 1024MB
  max_entries_limit_per_query: 100000
  reject_old_samples: false
  max_query_series: 100000
  allow_structured_metadata: true

query_range:
  cache_results: false

analytics:
  reporting_enabled: false
