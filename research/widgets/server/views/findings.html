<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search results</title>
<!-- kit:css -->
<style>
  .notes { margin: 8px 0 2px; padding: 8px 10px; border-radius: var(--radius); background: var(--bg-2); font-size: 13px; line-height: 1.45; }
  .bar { margin-top: 10px; gap: 6px; }
  .bar input { flex: 1; min-width: 120px; font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  .docs { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .doc { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
  .doc .top { display: flex; gap: 10px; align-items: baseline; }
  .doc .n { flex: none; width: 20px; height: 20px; border-radius: 6px; background: var(--bg-2); color: var(--ink-2); font-size: 11px; font-weight: 600; display: grid; place-items: center; }
  .doc .t { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .doc a.t { color: var(--ink); text-decoration: none; cursor: pointer; }
  .doc a.t:hover { text-decoration: underline; }
  .doc .meta { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .doc .sum { font-size: 13px; line-height: 1.45; margin: 6px 0 0 30px; color: var(--ink); }
  .doc blockquote { margin: 6px 0 0 30px; padding: 2px 0 2px 10px; border-left: 3px solid var(--line); color: var(--ink-2); font-size: 12.5px; line-height: 1.45; }
  .doc .facts { margin: 6px 0 0 30px; gap: 4px; }
  .doc .acts { margin: 8px 0 0 30px; gap: 6px; }
  .doc .acts .btn { font-size: 12px; padding: 3px 10px; }
  .more { border: 0; background: none; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; padding: 0; margin: 4px 0 0 30px; }
  .table { overflow-x: auto; margin-top: 10px; border: 1px solid var(--line); border-radius: var(--radius); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  th { font-weight: 500; color: var(--ink-2); background: var(--bg-2); font-size: 12px; white-space: nowrap; }
  td.lab { color: var(--ink-2); font-size: 12px; background: var(--bg-2); white-space: nowrap; }
</style>
</head>
<body>
<div id="root" class="empty">Looking…</div>
<!-- kit:sdk -->
<!-- kit:js -->
<script type="module">
// What Claude found for a request, as documents: each with its source and
// date, what it says, the passages quoted and the facts it gives, the
// facts side by side when the documents share them, and a filter. Opening
// a document goes through the host; asking about one asks Claude.
const { connect, ask, tell, link, esc } = globalThis.Kit
const root = document.getElementById('root')
let app = null
let data = null
let view = 'list'
let order = 'best'
let words = ''
const open = new Set()

const shown = () => {
  const w = words.toLowerCase()
  const docs = data.documents.filter(d => !w || `${d.title} ${d.source ?? ''} ${d.summary} ${d.quotes.join(' ')}`.toLowerCase().includes(w))
  return order === 'new' ? [...docs].sort((a, b) => String(b.date ?? '').localeCompare(String(a.date ?? ''))) : docs
}

const fact = v => (v === true ? 'yes' : v === false ? 'no' : v == null ? '' : String(v))

function doc(d) {
  const meta = [d.source, d.date, d.kind].filter(Boolean).map(esc).join(' · ')
  const quotes = open.has(d.n) ? d.quotes : d.quotes.slice(0, 1)
  const facts = Object.entries(d.facts)
  return `<div class="doc">
    <div class="top"><span class="n">${d.n}</span><div>${d.url ? `<a class="t" data-open="${d.n}" title="${esc(d.url)}">${esc(d.title)}</a>` : `<span class="t">${esc(d.title)}</span>`}${meta ? `<div class="meta">${meta}</div>` : ''}</div></div>
    <div class="sum">${esc(d.summary)}</div>
    ${quotes.map(q => `<blockquote>“${esc(q)}”</blockquote>`).join('')}
    ${d.quotes.length > 1 ? `<button class="more" data-more="${d.n}">${open.has(d.n) ? 'Fewer passages' : `${d.quotes.length - 1} more passage${d.quotes.length > 2 ? 's' : ''}`}</button>` : ''}
    ${facts.length ? `<div class="row wrap facts">${facts.map(([k, v]) => `<span class="chip">${esc(k.replace(/_/g, " "))}: ${esc(fact(v))}</span>`).join('')}</div>` : ''}
    <div class="row acts">${d.url ? `<button class="btn" data-open="${d.n}">Open</button>` : ''}<button class="btn" data-ask="${d.n}">Ask about this</button></div>
  </div>`
}

function table(docs) {
  return `<div class="table"><table><thead><tr><th></th>${docs.map(d => `<th title="${esc(d.title)}">${d.n}. ${esc((d.source ?? d.title).slice(0, 28))}</th>`).join('')}</tr></thead><tbody>` +
    data.facts.map(f => `<tr><td class="lab">${esc(f.replace(/_/g, " "))}</td>${docs.map(d => `<td>${esc(fact(d.facts[f]))}</td>`).join('')}</tr>`).join('') +
    `<tr><td class="lab">says</td>${docs.map(d => `<td>${esc(d.summary.length > 140 ? `${d.summary.slice(0, 140)}…` : d.summary)}</td>`).join('')}</tr></tbody></table></div>`
}

function draw(next) {
  if (next) data = next
  if (!data) return
  if (!data.documents?.length) {
    root.className = 'empty'
    root.textContent = data.query ? `Nothing found for “${data.query}” yet. Ask Claude to look for something.` : 'Ask Claude to look something up, and what it finds shows here.'
    return
  }
  const docs = shown()
  const sideBySide = data.facts.length > 0 && data.documents.filter(d => Object.keys(d.facts).length).length > 1
  root.className = ''
  root.innerHTML = `<div class="row between"><span class="title">${esc(data.query)}</span><span class="faint">${data.documents.length} source${data.documents.length > 1 ? 's' : ''}</span></div>
    ${data.notes ? `<div class="notes">${esc(data.notes)}</div>` : ''}
    <div class="row bar wrap">
      <input id="words" placeholder="Filter by a word or a source" value="${esc(words)}" autocomplete="off">
      <span class="tabs"><button class="tab" data-order="best" aria-pressed="${order === 'best'}">Best first</button><button class="tab" data-order="new" aria-pressed="${order === 'new'}">Newest</button></span>
      ${sideBySide ? `<span class="tabs"><button class="tab" data-view="list" aria-pressed="${view === 'list'}">List</button><button class="tab" data-view="table" aria-pressed="${view === 'table'}">Side by side</button></span>` : ''}
    </div>
    ${docs.length ? (view === 'table' && sideBySide ? table(docs) : `<div class="docs">${docs.map(doc).join('')}</div>`) : '<div class="empty">No document matches that.</div>'}
    <div class="foot faint">Found by Claude for this request; each document links to where it came from.</div>`
  const input = document.getElementById('words')
  input.oninput = () => {
    words = input.value
    const at = input.selectionStart
    draw()
    const again = document.getElementById('words')
    again.focus()
    again.setSelectionRange(at, at)
  }
}

root.addEventListener('click', async e => {
  const t = e.target.closest('[data-open],[data-ask],[data-more],[data-order],[data-view]')
  if (!t) return
  const d = data.documents.find(x => String(x.n) === (t.dataset.open ?? t.dataset.ask ?? t.dataset.more))
  if (t.dataset.order) { order = t.dataset.order; draw() }
  if (t.dataset.view) { view = t.dataset.view; draw() }
  if (t.dataset.more) { open.has(d.n) ? open.delete(d.n) : open.add(d.n); draw() }
  if (t.dataset.open && d?.url) {
    await link(app, d.url)
    tell(app, `The person opened document ${d.n}, “${d.title}” (${d.url}).`)
  }
  if (t.dataset.ask && d) await ask(app, `Tell me more about “${d.title}”${d.source ? ` (${d.source})` : ''}.`)
})

app = await connect('Search results', draw)
</script>
</body>
</html>
