<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight</title>
<!-- kit:css -->
<style>
  .map { margin: 10px 0 0; border-radius: var(--radius); overflow: hidden; background: var(--bg-2); }
  .map svg { display: block; width: 100%; height: 190px; }
  .land { fill: var(--line); stroke: var(--bg); stroke-width: .4; }
  .trail { fill: none; stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 2 2; vector-effect: non-scaling-stroke; }
  .plane { fill: var(--accent); stroke: var(--bg); stroke-width: .6; }
  .halo { fill: var(--accent); opacity: .18; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin-top: 10px; }
  .stats div { background: var(--bg-2); border-radius: 8px; padding: 6px 9px; }
  .stats b { display: block; font-size: 14px; font-weight: 600; }
  .others { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
</style>
</head>
<body>
<div id="root" class="empty">Finding the flight…</div>
<script>/* kit:world */</script>
<!-- kit:sdk -->
<!-- kit:js -->
<script type="module">
const { connect, call, ask, number, ago, esc } = globalThis.Kit
const W = globalThis.WORLD
const root = document.getElementById('root')
let app = null, data = null, timer = null

const project = (lat, lon) => [((lon + 180) / 360) * W.w, ((W.top - lat) / W.span) * W.h]

function map(d) {
  const [x, y] = project(d.lat, d.lon)
  const vw = 300, vh = 115
  const vx = Math.min(W.w - vw, Math.max(0, x - vw / 2)), vy = Math.min(W.h - vh, Math.max(0, y - vh / 2))
  const trail = (d.trail ?? []).map(([a, b]) => project(a, b).map(n => n.toFixed(1)).join(',')).join(' ')
  return `<svg viewBox="${vx} ${vy} ${vw} ${vh}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(d.callsign)} over ${esc(d.over)}">
    <path class="land" d="${W.world}"/>
    ${trail ? `<polyline class="trail" points="${trail}"/>` : ''}
    <circle class="halo" cx="${x}" cy="${y}" r="7"/>
    <g transform="translate(${x} ${y}) rotate(${d.heading}) scale(.42)"><path class="plane" d="M0,-10 L2,-3 L10,2 L10,4 L2,2 L1.5,8 L4,10 L4,11 L0,10 L-4,11 L-4,10 L-1.5,8 L-2,2 L-10,4 L-10,2 L-2,-3Z"/></g>
  </svg>`
}

function draw(next) {
  data = next
  root.className = ''
  clearInterval(timer)
  if (!data.found) {
    root.innerHTML = `
      <div class="title">${esc(data.callsign)}${data.airline ? ` · ${esc(data.airline)}` : ''}</div>
      <div class="empty">${data.unavailable ? `The flight radar isn't answering right now.<br><span class="faint">${esc(data.note)}</span><br><button class="btn" data-again>Try again</button>` : 'Not in the air right now.'}</div>
      ${data.airborne?.length ? `<div class="faint" style="text-align:center">${esc(data.airline ?? 'This airline')} in the air now</div>
        <div class="others">${data.airborne.map(c => `<button class="btn" data-cs="${esc(c)}">${esc(c)}</button>`).join('')}</div>` : ''}
      <div class="foot faint">${esc(data.source)} · ${ago(data.asOf)}</div>`
    root.querySelectorAll('[data-cs]').forEach(b => b.onclick = () => load(b.dataset.cs))
    const again = root.querySelector('[data-again]')
    if (again) again.onclick = () => { again.disabled = true; again.textContent = 'Trying…'; load(data.query ?? data.callsign) }
    return
  }
  const climb = data.climbFpm > 300 ? 'climbing' : data.climbFpm < -300 ? 'descending' : 'level'
  root.innerHTML = `
    <div class="row between">
      <div><div class="title">${esc(data.callsign)}${data.airline ? ` · ${esc(data.airline)}` : ''}</div>
        <div class="faint">over ${esc(data.over)} · ${number(data.lat, 2)}, ${number(data.lon, 2)}</div></div>
      <span class="chip ${data.onGround ? '' : 'up'}">${data.onGround ? 'On the ground' : 'In the air'}</span>
    </div>
    <div class="map">${map(data)}</div>
    <div class="stats num">
      <div><span class="faint">Altitude</span><b>${number(data.altitudeFt)} ft</b></div>
      <div><span class="faint">Speed</span><b>${number(data.speedKts)} kt</b></div>
      <div><span class="faint">Heading</span><b>${data.heading}°</b></div>
      <div><span class="faint">Vertical</span><b>${climb}</b></div>
    </div>
    <div class="row between foot wrap">
      <span class="faint"><span class="live ${data.source === 'simulated' ? 'off' : ''}"></span> ${esc(data.source)} · ${ago(data.asOf)} · registered in ${esc(data.registeredIn)}</span>
      <button class="btn" id="eta">When does it land?</button>
    </div>`
  root.querySelector('#eta').onclick = () => ask(app, `When does ${data.callsign} land, and is it on time?`)
  timer = setInterval(() => load(data.callsign, true), 15_000)
}

async function load(flight, quiet) {
  try { draw(await call(app, 'flight_track', { flight })) } catch (e) { if (!quiet) root.insertAdjacentHTML('beforeend', `<p class="faint">${esc(e.message)}</p>`) }
}

draw.input = args => { root.textContent = `Finding ${args.flight ?? 'the flight'}…` }
draw.error = text => { root.className = 'empty'; root.textContent = text }
app = await connect('Flight tracker', draw)
</script>
</body>
</html>
