[package]
name = "chloedb-img"
version = "0.3.7"
edition = "2021"
license = "Apache-2.0"
description = "Image Explorer on ChloeDB: 12.4 million public-domain and CC0 pictures (PD12M) searched by what is in them, with words, a photo of your own, a detail of a picture, a picture plus words, colors and a map of themes"

# A client of chloedb-server over HTTP, as chloedb-arxiv is, except that
# it embeds words and photos itself, with ChloeDB's CLIP (feature vision),
# so that the servers it searches are the stock image, without models.
[dependencies]
chloedb = { path = "../chloedb", default-features = false, features = ["vision"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
axum = { version = "0.7", features = ["multipart"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }
parquet = { version = "59.3", default-features = false, features = ["arrow", "snap", "zstd", "lz4"] }
arrow-array = "59.3"
arrow-schema = "59.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
base64 = "0.22"
sha1_smol = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# CI's tests (cargo test --profile ci), as in the other crates.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
