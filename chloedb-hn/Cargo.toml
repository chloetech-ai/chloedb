[package]
name = "chloedb-hn"
version = "0.3.7"
edition = "2021"
license = "Apache-2.0"
description = "Hacker News on ChloeDB: every story and comment searched by words and meaning, with typo tolerance, facets, threads, trends, experts, the reply graph and cited answers, kept live from the HN API"

# A client of chloedb-server over HTTP, as chloedb-netops is: no ChloeDB
# crate in its build. Parquet is read only by `prepare`, which turns the
# archive into rows for the server to load.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
axum = "0.7"
tower = { version = "0.5", default-features = false, features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }
parquet = { version = "59.3", default-features = false, features = ["arrow", "snap", "zstd", "lz4"] }
arrow-array = "59.3"
arrow-schema = "59.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The crawl of the stories' links: ChloeDB's own crawler, its fetcher
# (robots.txt, politeness, public addresses only) and its reading of a page.
chloedb-crawl = { path = "../chloedb-crawl" }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# CI's tests (cargo test --profile ci), as in the other crates.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
