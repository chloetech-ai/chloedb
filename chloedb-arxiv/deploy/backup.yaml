# A checkpoint a night of each arXiv server, on its node's own disk, after
# the Hacker News shards' (3:00 to 3:30 AM Pacific): POST /v1/admin/checkpoint
# writes a consistent copy into the server's --backup-dir while it serves,
# hard-linking the files the previous one has, and the two newest are kept.
# The newest is then copied off the node to a DigitalOcean volume (one
# volume, a folder a server, attached to each job in turn: the search
# server's at 3:40, the graph server's at 4:10), so losing a node loses at
# most a day. A restore is a checkpoint copied back in place of the
# database with the server stopped.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: arxiv-backup, namespace: strata}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage
  resources: {requests: {storage: 50Gi}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: arxiv-backup, namespace: strata}
data:
  backup.sh: |
    #!/bin/sh
    set -eu
    apk add --no-cache curl rsync >/dev/null
    NAME="n-$(date -u +%Y%m%d-%H%M)"
    PREV="$(ls -1 /local/backup 2>/dev/null | grep '^n-' | sort | tail -1 || true)"
    BODY="{\"name\":\"$NAME\",\"layout\":\"dir\"${PREV:+,\"link_from\":\"$PREV\"}}"
    t0=$(date +%s)
    curl -sS -f -m 3000 -X POST -H "Authorization: Bearer $KEY" -H 'content-type: application/json' "$SERVER/v1/admin/checkpoint" -d "$BODY"
    echo
    echo "checkpoint $NAME in $(( $(date +%s) - t0 )) s: $(du -sh "/local/backup/$NAME" | cut -f1)"
    if [ -d /vol ]; then
      D="/vol/$WHO"
      mkdir -p "$D"
      rsync -a --delete "/local/backup/$NAME/" "$D/latest/" && echo "$NAME" > "$D/latest.name" && sync
      echo "copied off the node to $D in $(( $(date +%s) - t0 )) s: $(du -sh "$D/latest" | cut -f1)"
    fi
    ls -1 /local/backup | grep '^n-' | sort -r | tail -n +3 | while read -r old; do rm -rf "/local/backup/$old"; done
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: arxiv-backup-search, namespace: strata}
spec:
  schedule: "40 3 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          nodeSelector: {chloedb/arxiv-role: search}
          tolerations: [{key: chloedb/pool, operator: Equal, value: arxiv, effect: NoSchedule}]
          containers:
          - name: b
            image: mirror.gcr.io/library/alpine:3.20
            command: ["sh", "/script/backup.sh"]
            env:
            - {name: SERVER, value: "http://arxiv-search.strata.svc:7700"}
            - {name: WHO, value: "search"}
            - {name: KEY, valueFrom: {secretKeyRef: {name: arxiv-admin, key: token}}}
            volumeMounts: [{name: local, mountPath: /local}, {name: script, mountPath: /script}, {name: vol, mountPath: /vol}]
          volumes:
          - {name: local, hostPath: {path: /mnt/arxiv/db, type: Directory}}
          - {name: script, configMap: {name: arxiv-backup}}
          - {name: vol, persistentVolumeClaim: {claimName: arxiv-backup}}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: arxiv-backup-graph, namespace: strata}
spec:
  schedule: "10 4 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          nodeSelector: {chloedb/arxiv-role: graph}
          tolerations: [{key: chloedb/pool, operator: Equal, value: arxiv, effect: NoSchedule}]
          containers:
          - name: b
            image: mirror.gcr.io/library/alpine:3.20
            command: ["sh", "/script/backup.sh"]
            env:
            - {name: SERVER, value: "http://arxiv-graph.strata.svc:7700"}
            - {name: WHO, value: "graph"}
            - {name: KEY, valueFrom: {secretKeyRef: {name: arxiv-admin, key: token}}}
            volumeMounts: [{name: local, mountPath: /local}, {name: script, mountPath: /script}, {name: vol, mountPath: /vol}]
          volumes:
          - {name: local, hostPath: {path: /mnt/arxiv/db, type: Directory}}
          - {name: script, configMap: {name: arxiv-backup}}
          - {name: vol, persistentVolumeClaim: {claimName: arxiv-backup}}
