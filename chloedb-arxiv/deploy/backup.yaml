apiVersion: batch/v1
kind: CronJob
metadata: {name: arxiv-backup-search, namespace: strata}
spec:
  schedule: "40 3 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          nodeSelector: {chloedb/arxiv-role: search}
          tolerations: [{key: chloedb/pool, operator: Equal, value: arxiv, effect: NoSchedule}]
          containers:
          - name: b
            image: mirror.gcr.io/library/alpine:3.20
            command: ["sh", "/script/backup.sh"]
            env:
            - {name: SERVER, value: "http://arxiv-search.strata.svc:7700"}
            - {name: WHO, value: "search"}
            - {name: WARM_URL, value: "http://arxiv-app.strata.svc:7860"}
            - {name: KEY, valueFrom: {secretKeyRef: {name: arxiv-admin, key: token}}}
            volumeMounts: [{name: local, mountPath: /local}, {name: script, mountPath: /script}, {name: vol, mountPath: /vol}]
          volumes:
          - {name: local, hostPath: {path: /mnt/arxiv/db, type: Directory}}
          - {name: script, configMap: {name: arxiv-backup}}
          - {name: vol, persistentVolumeClaim: {claimName: arxiv-backup}}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: arxiv-backup-graph, namespace: strata}
spec:
  schedule: "10 4 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          nodeSelector: {chloedb/arxiv-role: graph}
          tolerations: [{key: chloedb/pool, operator: Equal, value: arxiv, effect: NoSchedule}]
          containers:
          - name: b
            image: mirror.gcr.io/library/alpine:3.20
            command: ["sh", "/script/backup.sh"]
            env:
            - {name: SERVER, value: "http://arxiv-graph.strata.svc:7700"}
            - {name: WHO, value: "graph"}
            - {name: WARM_FILE, value: "/local/arxiv-graph.chloedb"}
            - {name: KEY, valueFrom: {secretKeyRef: {name: arxiv-admin, key: token}}}
            volumeMounts: [{name: local, mountPath: /local}, {name: script, mountPath: /script}, {name: vol, mountPath: /vol}]
          volumes:
          - {name: local, hostPath: {path: /mnt/arxiv/db, type: Directory}}
          - {name: script, configMap: {name: arxiv-backup}}
          - {name: vol, persistentVolumeClaim: {claimName: arxiv-backup}}
