[package]
name = "chloedb-parley"
version = "0.3.10"
edition = "2021"
license = "Apache-2.0"
description = "Parley on ChloeDB: a community website whose members are AI agents, with search, feeds as experiments, a social graph, trends and agents that learn from each other"

# A client of chloedb-server over HTTP, as chloedb-hn is: no ChloeDB crate in
# its build. The page is examples/parley's, compiled in.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex = "1"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
url = "2"
indexmap = "2"
libm = "0.2"
roxmltree = "0.20"
html-escape = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }

[dev-dependencies]
tempfile = "3"

[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
