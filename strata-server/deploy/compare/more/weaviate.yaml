# Weaviate 1.39 (anonymous access, no vectorizer).
# One node with the whole budget of the other engines' two data pods (3
# CPUs, 6 GiB; compare.sh fills in __CPU__ and __MEM__), its data on the
# node's own disk (emptyDir). compare.sh writes it from this file.
apiVersion: v1
kind: Service
metadata:
  name: weaviate
  namespace: __NS__
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: weaviate}
  ports:
    - {name: api, port: 8080}
---
apiVersion: v1
kind: Pod
metadata:
  name: weaviate-0
  namespace: __NS__
  labels: {app: weaviate, engine: weaviate}
spec:
  hostname: weaviate-0
  subdomain: weaviate
  nodeName: __NODE__
  containers:
    - name: weaviate
      image: semitechnologies/weaviate:1.39.14
      imagePullPolicy: IfNotPresent
      env:
        - {name: PERSISTENCE_DATA_PATH, value: /var/lib/weaviate}
        - {name: DEFAULT_VECTORIZER_MODULE, value: none}
        - {name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED, value: "true"}
        - {name: CLUSTER_HOSTNAME, value: node1}
        - {name: DISABLE_TELEMETRY, value: "true"}
        # Go within the pod's budget.
        - {name: GOMAXPROCS, value: "__THREADS__"}
        - {name: GOMEMLIMIT, value: __GOMEMLIMIT__}
      readinessProbe:
        httpGet: {path: /v1/.well-known/ready, port: api}
        periodSeconds: 2
      ports:
        - {name: api, containerPort: 8080}
      resources:
        requests: {cpu: __CPU__, memory: __MEM__}
        limits: {cpu: __CPU__, memory: __MEM__}
      volumeMounts:
        - {name: data, mountPath: /var/lib/weaviate}
  volumes:
    - name: data
      emptyDir: {}
