# Manticore Search 29.9 (with its columnar, secondary and KNN libraries).
# One node with the whole budget of the other engines' two data pods (3
# CPUs, 6 GiB; compare.sh fills in __CPU__ and __MEM__), its data on the
# node's own disk (emptyDir). compare.sh writes it from this file.
apiVersion: v1
kind: Service
metadata:
  name: manticore
  namespace: compare
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: manticore}
  ports:
    - {name: api, port: 9308}
---
apiVersion: v1
kind: Pod
metadata:
  name: manticore-0
  namespace: compare
  labels: {app: manticore, engine: manticore}
spec:
  hostname: manticore-0
  subdomain: manticore
  nodeName: __NODE__
  containers:
    - name: manticore
      image: manticoresearch/manticore:29.9.0
      imagePullPolicy: IfNotPresent
      readinessProbe:
        tcpSocket: {port: api}
        periodSeconds: 2
      ports:
        - {name: api, containerPort: 9308}
      resources:
        requests: {cpu: __CPU__, memory: __MEM__}
        limits: {cpu: __CPU__, memory: __MEM__}
      volumeMounts:
        - {name: data, mountPath: /var/lib/manticore}
  volumes:
    - name: data
      emptyDir: {}
