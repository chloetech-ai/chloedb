# Redis 8.8 with its query engine; in memory only (no snapshots, no append-only file), at most 5.5 GB.
# One node with the whole budget of the other engines' two data pods (3
# CPUs, 6 GiB; compare.sh fills in __CPU__ and __MEM__), its data on the
# node's own disk (emptyDir). compare.sh writes it from this file.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: compare
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: redis}
  ports:
    - {name: api, port: 6379}
---
apiVersion: v1
kind: Pod
metadata:
  name: redis-0
  namespace: compare
  labels: {app: redis, engine: redis}
spec:
  hostname: redis-0
  subdomain: redis
  nodeName: __NODE__
  containers:
    - name: redis
      image: redis:8.8.4
      imagePullPolicy: IfNotPresent
      # Queries may take 10 s (as Vespa's timeout here) and fail past it, not answer in part after 500 ms.
      args: [redis-server, --save, "", --appendonly, "no", --maxmemory, "5500mb", --maxmemory-policy, noeviction,
             --search-workers, "3", --search-timeout, "10000", --search-on-timeout, fail]
      readinessProbe:
        tcpSocket: {port: api}
        periodSeconds: 2
      ports:
        - {name: api, containerPort: 6379}
      resources:
        requests: {cpu: __CPU__, memory: __MEM__}
        limits: {cpu: __CPU__, memory: __MEM__}
      volumeMounts:
        - {name: data, mountPath: /data}
  volumes:
    - name: data
      emptyDir: {}
