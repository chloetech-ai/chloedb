\* Sync off (DbOptions::sync = false): a power loss may lose the newest
\* commits, but recovers a prefix of them; writers are told before durable.
CONSTANTS
    w1 = w1
    w2 = w2
    k1 = k1
    k2 = k2
    Writers <- MCWriters
    Keys = {k1}
    Menu <- MenuPutDel
    Writes <- TwoOne
    Flushers <- Both
    MaxVersions = 3
    MaxMerges = 1
    MaxCrashes = 1
    Sync = FALSE
    SyncFirst = TRUE
    MergeCarries = TRUE
    Tear = "sector"
    MaxRot = 0
    ZeroSlot1 = TRUE
    FixIntent = FALSE
SPECIFICATION Spec
INVARIANTS
    RecoveredPrefix
    LiveRowsCommitted
    OneRowAKey
    OpensAfterCrash
