\* A slot write that a crash leaves failing its checksum ("garbage"): opening
\* refuses (fallback_decision) though the crash lost no write.
CONSTANTS
    w1 = w1
    w2 = w2
    k1 = k1
    k2 = k2
    Writers <- MCWriters
    Keys = {k1}
    Menu <- MenuPutDel
    Writes <- TwoOne
    Flushers <- Both
    MaxVersions = 3
    MaxMerges = 1
    MaxCrashes = 1
    Sync = TRUE
    SyncFirst = TRUE
    MergeCarries = TRUE
    Tear = "garbage"
    MaxRot = 0
    ZeroSlot1 = TRUE
    FixIntent = FALSE
SPECIFICATION Spec
INVARIANTS
    RecoveredPrefix
    RecoveredAcknowledged
    LiveRowsCommitted
    ToldOnlyDurable
    OneRowAKey
    OpensAfterCrash
