\* The fix with damage after the fact, zeros of slot 1 too; one write each.
CONSTANTS
    w1 = w1
    w2 = w2
    k1 = k1
    k2 = k2
    Writers <- MCWriters
    Keys = {k1}
    Menu <- MenuPutDel
    Writes <- OneEach
    Flushers <- Both
    MaxVersions = 3
    MaxMerges = 1
    MaxCrashes = 1
    Sync = TRUE
    SyncFirst = TRUE
    MergeCarries = TRUE
    Tear = "garbage"
    MaxRot = 1
    ZeroSlot1 = TRUE
    FixIntent = TRUE
SPECIFICATION Spec
INVARIANTS
    NoSilentLoss
    LiveRowsCommitted
    OneRowAKey
