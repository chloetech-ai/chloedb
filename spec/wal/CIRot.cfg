\* Damage after the fact (a written slot fails its checksum or reads as zeros
\* later) and torn slot writes, the code as it is: slot 1 zeroed beside the
\* first version, after a flush emptied the log, opens with the commit lost.
CONSTANTS
    w1 = w1
    w2 = w2
    k1 = k1
    k2 = k2
    Writers <- MCWriters
    Keys = {k1}
    Menu <- MenuPutDel
    Writes <- TwoOne
    Flushers <- Both
    MaxVersions = 3
    MaxMerges = 1
    MaxCrashes = 1
    Sync = TRUE
    SyncFirst = TRUE
    MergeCarries = TRUE
    Tear = "garbage"
    MaxRot = 1
    ZeroSlot1 = TRUE
    FixIntent = FALSE
SPECIFICATION Spec
INVARIANTS
    NoSilentLoss
    LiveRowsCommitted
    OneRowAKey
