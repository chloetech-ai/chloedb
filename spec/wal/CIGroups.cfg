\* w1 upserts k1, w2 inserts k1 (which fails if live) or upserts k2: groups
\* that fail and run each write alone, transactions of two keys. Sync on.
CONSTANTS
    w1 = w1
    w2 = w2
    k1 = k1
    k2 = k2
    Writers <- MCWriters
    Keys = {k1, k2}
    Menu <- MenuGroups
    Writes <- TwoOne
    Flushers <- Both
    MaxVersions = 3
    MaxMerges = 1
    MaxCrashes = 1
    Sync = TRUE
    SyncFirst = TRUE
    MergeCarries = TRUE
    Tear = "sector"
    MaxRot = 0
    ZeroSlot1 = TRUE
    FixIntent = FALSE
SPECIFICATION Spec
INVARIANTS
    RecoveredPrefix
    RecoveredAcknowledged
    LiveRowsCommitted
    ToldOnlyDurable
    OneRowAKey
    OpensAfterCrash
