\* Either writer upserts or deletes k1 (w1 twice, w2 once); three versions,
\* two crashes. Sync on, slot writes sector-atomic.
CONSTANTS
    w1 = w1
    w2 = w2
    k1 = k1
    k2 = k2
    Writers <- MCWriters
    Keys = {k1}
    Menu <- MenuAny
    Writes <- TwoOne
    Flushers <- Both
    MaxVersions = 3
    MaxMerges = 1
    MaxCrashes = 2
    Sync = TRUE
    SyncFirst = TRUE
    MergeCarries = TRUE
    Tear = "sector"
    MaxRot = 0
    ZeroSlot1 = TRUE
    FixIntent = FALSE
SPECIFICATION Spec
INVARIANTS
    RecoveredPrefix
    RecoveredAcknowledged
    LiveRowsCommitted
    ToldOnlyDurable
    OneRowAKey
    OpensAfterCrash
