\* As Order, the handover asking every copy at once and answering its primary's calls meanwhile (before Follow::campaign took `first`): the primary is fenced by the candidate's term, refuses, and the shard is left with no primary
CONSTANTS
    c0 = c0
    c1 = c1
    c2 = c2
    Copies <- MCTwo
    First = c0
    Auto = FALSE
    ByHand = TRUE
    Campaigns = TRUE
    After = 4
    Drift = 0
    Pause = 2
    Bug = "asks-every-copy-at-once"
    HoldRule = "primaries"
    RestartFix = TRUE
    Prompt = TRUE
    Overlap = FALSE
    MaxTerm = 3
    MaxWrites = 1
    MaxRestarts = 0
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneCopyATerm
    NoLostWrite
    NoOrphanedFence
