\* Failover by hand only, three copies: the old primary takes writes until it hears of the new term while the new one takes them (the code does not promise one writer at a time)
CONSTANTS
    c0 = c0
    c1 = c1
    c2 = c2
    Copies <- MCThree
    First = c0
    Auto = FALSE
    ByHand = TRUE
    Campaigns = FALSE
    After = 3
    Drift = 0
    Pause = 1
    Bug = "none"
    HoldRule = "primaries"
    RestartFix = TRUE
    Prompt = FALSE
    Overlap = FALSE
    MaxTerm = 2
    MaxWrites = 1
    MaxRestarts = 0
SPECIFICATION Spec
SYMMETRY MCSymmetry
INVARIANTS
    TypeOK
    OneCopyATerm
    NoLostWrite
    OldPrimaryAcksNothing
    OneWriter
