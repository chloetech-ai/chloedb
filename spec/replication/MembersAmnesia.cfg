\* #551 and members-only campaigns, a volume lost as the simulator loses one (may_lose_volume): a copy that lost its volume forgets its vote
CONSTANTS
    c0 = c0
    c1 = c1
    c2 = c2
    Copies <- MCCopies
    First = c0
    Rule = "fix"
    MembersCampaign = TRUE
    LossGuard = "sim"
    MaxTerm = 3
    MaxWrites = 2
    MaxCrashes = 2
    MaxLost = 1
SPECIFICATION Spec
SYMMETRY MCSymmetry
INVARIANTS
    TypeOK
    OneCopyATerm
    NoLostWrite
    LogMatching
